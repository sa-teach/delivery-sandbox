name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fail on purpose if FAIL_CI exists
        run: |
          if [ -f FAIL_CI ]; then
            echo "FAIL_CI found, failing on purpose"
            exit 1
          fi
          echo "OK"